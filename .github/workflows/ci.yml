name: CI-Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
      - uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: 11
          cache: gradle
      - name: Test Build
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease
      - name: Get Module Version
        id: module-version
        run: |
          MODULE_VERSION=$(cat module.gradle | grep "moduleVersion =" | awk -F'"' '{print $2}')
          echo "version=$MODULE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: ZygiskFrida-${{ steps.module-version.outputs.version }}-release
          path: out/magisk_module_zygisk_release
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: ZygiskFrida-${{ steps.module-version.outputs.version }}-riru-release
          path: out/magisk_module_riru_release
      - name: Create Release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.module-version.outputs.version }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION does not exist. Creating..."
            cd out/magisk_module_zygisk_release
            zip -r ../../ZygiskFrida-$VERSION-release.zip .
            cd ../../
            cd out/magisk_module_riru_release
            zip -r ../../ZygiskFrida-$VERSION-riru-release.zip .
            cd ../../
            gh release create "$VERSION" ZygiskFrida-$VERSION-release.zip ZygiskFrida-$VERSION-riru-release.zip --title "$VERSION" --notes "Release $VERSION"
          else
            echo "Release $VERSION already exists. Skipping."
          fi
